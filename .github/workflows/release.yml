name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: pdbinspector
            asset_name: pdbinspector-linux-x86_64

          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: pdbinspector
            asset_name: pdbinspector-linux-aarch64
            cross: true

          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: pdbinspector
            asset_name: pdbinspector-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: pdbinspector
            asset_name: pdbinspector-macos-aarch64

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: pdbinspector.exe
            asset_name: pdbinspector-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Configure cross-compilation
        if: matrix.cross
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Strip binary (Linux/macOS)
        if: matrix.os != 'windows-latest' && !matrix.cross
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Strip binary (Linux cross-compiled)
        if: matrix.cross
        run: aarch64-linux-gnu-strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-cargo-

      - name: Build WASM package
        run: |
          cd wasm
          wasm-pack build --target web --release

      - name: Prepare web artifacts
        run: |
          mkdir -p web-dist
          cp web/index.html web-dist/
          cp -r wasm/pkg web-dist/

      - name: Upload web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdbinspector-web
          path: web-dist/

      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: pdbinspector-wasm-pkg
          path: wasm/pkg/

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [test, build-wasm]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download web artifacts
        uses: actions/download-artifact@v4
        with:
          name: pdbinspector-web
          path: web-dist

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Create Release
    needs: [build, test, build-wasm]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Linux x86_64
          cp artifacts/pdbinspector-linux-x86_64/pdbinspector release/pdbinspector-linux-x86_64
          chmod +x release/pdbinspector-linux-x86_64
          # Linux ARM64
          cp artifacts/pdbinspector-linux-aarch64/pdbinspector release/pdbinspector-linux-aarch64
          chmod +x release/pdbinspector-linux-aarch64
          # macOS x86_64
          cp artifacts/pdbinspector-macos-x86_64/pdbinspector release/pdbinspector-macos-x86_64
          chmod +x release/pdbinspector-macos-x86_64
          # macOS ARM64
          cp artifacts/pdbinspector-macos-aarch64/pdbinspector release/pdbinspector-macos-aarch64
          chmod +x release/pdbinspector-macos-aarch64
          # Windows
          cp artifacts/pdbinspector-windows-x86_64.exe/pdbinspector.exe release/pdbinspector-windows-x86_64.exe
          # WASM package (zip for convenience)
          cd artifacts/pdbinspector-wasm-pkg && zip -r ../../release/pdbinspector-wasm.zip . && cd ../..
          # Web distribution (zip for convenience)
          cd artifacts/pdbinspector-web && zip -r ../../release/pdbinspector-web.zip . && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
