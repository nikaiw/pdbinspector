[package]
name = "pdbinspector"
version = "0.1.0"
edition = "2021"
description = "A tool to inspect and analyze Microsoft PDB (Program Database) files"
rust-version = "1.75"

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
# Core safety: no panics in production code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
pdb = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
walkdir = "2.5"
anyhow = "1.0"
memmap2 = "0.9"
clap = { version = "4.4", features = ["derive"] }
msvc-demangler = "0.10"
